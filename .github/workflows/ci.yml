name: BerTele2 CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bertele2-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend • Python / Ruff / Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Compile Python sources
        run: python -m compileall -q app tests

      - name: Run Ruff
        run: ruff check app tests

      - name: Run tests
        env:
          APP_ENV: test
          DEBUG: "false"
          JWT_SECRET_KEY: ci-test-secret-change-me
          DEFAULT_ADMIN_USERNAME: admin
          DEFAULT_ADMIN_PASSWORD: ci-test-password
        run: pytest -q

  frontend:
    name: Frontend • TypeScript / Lint / Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build dashboard
        run: npm run build

      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: bertele2-dashboard-dist
          path: dashboard/dist
          if-no-files-found: error
          retention-days: 7

  docker:
    name: Docker • Backend image build
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: bertele2:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
