[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bertele2"
version = "0.1.0"
description = "BerTele2 Telegram MTProto Gateway"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "BerTele2 Contributors"}]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "telethon>=1.36.0",
  "SQLAlchemy>=2.0.30",
  "alembic>=1.13.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "httpx>=0.27.0",
  "aiosqlite>=0.20.0",
  "asyncpg>=0.29.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2.0"]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100
target-version = ["py312"]
